<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f3f2"><meta name="description" content="지도에서 가고 싶은 곳을 찾아 차량에 추가하세요."><title>GMG · 장소 추가</title><link rel="icon" type="image/svg+xml" href="/moagil-mark.svg?v=gmg"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header class="topbar"><div class="brand"><img src="/moagil-mark.svg?v=gmg" width="34" height="34" alt=""><span>GMG</span></div><span id="connection" class="connection" role="status">연결 중</span></header>
<main class="map-shell">
 <section class="map-stage" aria-label="장소 지도"><div id="map" hidden></div><div id="mapFallback" class="map-fallback"><span aria-hidden="true">⌖</span><p id="mapHint">지도를 불러오고 있어요.</p></div></section>
 <section id="searchDock" class="search-dock" aria-label="장소 검색" hidden>
  <form id="searchForm" class="search-form"><span class="search-icon" aria-hidden="true">⌕</span><input id="query" type="search" placeholder="어디로 가고 싶나요?" aria-label="장소 검색어" maxlength="100" minlength="2" required autocomplete="off"><button id="searchButton" class="primary" type="submit">검색</button></form>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div><button id="retrySearch" class="text-button retry" hidden>다시 검색하기</button>
  <section id="resultsPanel" class="results-panel" aria-label="검색 결과" hidden><div class="results-heading"><h1 id="resultsTitle">검색 결과</h1><button id="clearResults" class="icon-button" aria-label="검색 결과 닫기">×</button></div><div id="results" class="results-list"></div></section>
 </section>
 <section id="savedShelf" class="saved-shelf" aria-label="추가한 장소" hidden>
  <div class="saved-heading"><h2>추가한 장소 <span id="count">0</span></h2><button id="savedDetails" class="shelf-info" disabled>정보</button><span id="savedPosition" class="saved-position" role="status" aria-live="polite"></span><button id="previousSaved" class="shelf-arrow" aria-label="이전 장소">‹</button><button id="nextSaved" class="shelf-arrow" aria-label="다음 장소">›</button></div>
  <div id="savedPlaces" class="saved-carousel" role="group" aria-label="좌우로 넘겨서 장소 보기"></div>
 </section>
 <div id="successToast" class="success-toast" role="status" aria-live="polite" hidden></div>
 <div class="map-controls" role="group" aria-label="지도 조작">
  <button id="fitMap" class="map-tool" aria-label="전체 장소 보기" title="전체 장소 보기" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/><circle cx="12" cy="12" r="3"/></svg></button>
  <button id="zoomIn" class="map-tool" aria-label="지도 확대" title="확대" disabled>+</button>
  <button id="zoomOut" class="map-tool" aria-label="지도 축소" title="축소" disabled>−</button>
 </div>
 <section id="welcome" class="welcome-card" hidden><h1>차량 QR로 연결해 주세요</h1><p>연결하면 지도에서 가고 싶은 곳을<br>찾아 추가할 수 있어요.</p><details><summary>초대 링크로 연결하기</summary><form id="joinForm"><input id="joinLink" type="url" placeholder="받은 초대 링크" aria-label="초대 링크" required><button class="primary">연결</button></form></details></section>
</main>
<dialog id="placeSheet" class="sheet detail-dialog" aria-labelledby="placeName">
 <header class="detail-header"><div class="sheet-top"><span id="placeCategory" class="eyebrow">장소</span><button id="closePlace" class="icon-button" aria-label="장소 정보 닫기">×</button></div><h2 id="placeName"></h2><p id="placeAddress" class="address"></p></header>
 <div class="detail-body"><div id="placeInfo" class="place-info" hidden></div></div>
 <footer class="detail-footer"><p id="placeNotice" class="help"></p><label id="consentRow" class="consent-row"><input id="sharingConsent" type="checkbox"><span>이 장소를 모임과 공유하는 데 동의해요.</span></label><p id="placeError" class="field-error" role="alert" hidden></p><button id="addPlace" class="primary full">차량에 추가</button><a class="privacy-link" href="/privacy" target="_blank" rel="noopener noreferrer">정보 저장과 삭제</a></footer>
</dialog>
</body>
</html>
